name: Daily Cloudflare Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Download Latest Binary
        run: |
          gh release download latest -p "cf-gateway-sync" --repo ${{ github.repository }}
          chmod +x cf-gateway-sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Sync Engine
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS }}
        run: ./cf-gateway-sync
